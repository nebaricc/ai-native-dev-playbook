<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9eed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4a9eed" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="320" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="1100" y2="40"/>
    <line x1="0" y1="80" x2="1100" y2="80"/>
    <line x1="0" y1="120" x2="1100" y2="120"/>
    <line x1="0" y1="160" x2="1100" y2="160"/>
    <line x1="0" y1="200" x2="1100" y2="200"/>
    <line x1="0" y1="240" x2="1100" y2="240"/>
    <line x1="0" y1="280" x2="1100" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Title -->
  <text x="550" y="52" text-anchor="middle" fill="#e5e5e5" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5">AI-Native Development Playbook</text>
  <text x="550" y="80" text-anchor="middle" fill="#a0a0a0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">From velocity theater to production quality</text>

  <!-- Phase 1: Context -->
  <rect x="60" y="110" width="200" height="110" rx="10" fill="url(#blueGlow)" stroke="#4a9eed" stroke-width="1.5" opacity="0.9"/>
  <text x="100" y="145" fill="#4a9eed" font-family="ui-monospace, monospace" font-size="22" font-weight="600">{ }</text>
  <text x="160" y="145" fill="#a5d8ff" font-family="system-ui, sans-serif" font-size="18" font-weight="500">Context</text>
  <text x="80" y="175" fill="#6b93b8" font-family="system-ui, sans-serif" font-size="13">CLAUDE.md</text>
  <text x="80" y="195" fill="#6b93b8" font-family="system-ui, sans-serif" font-size="13">.cursorrules</text>
  <text x="80" y="205" fill="#6b93b8" font-family="system-ui, sans-serif" font-size="13">.cursor/rules/</text>
  <text x="160" y="175" fill="#6b93b8" font-family="system-ui, sans-serif" font-size="13">settings.json</text>
  <text x="160" y="195" fill="#6b93b8" font-family="system-ui, sans-serif" font-size="13">skills/</text>

  <!-- Arrow 1-2 -->
  <line x1="270" y1="165" x2="310" y2="165" stroke="#4a9eed" stroke-width="1.5" opacity="0.5"/>
  <polygon points="310,160 320,165 310,170" fill="#4a9eed" opacity="0.5"/>

  <!-- Phase 2: Enforcement -->
  <rect x="325" y="110" width="200" height="110" rx="10" fill="url(#purpleGlow)" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9"/>
  <text x="365" y="145" fill="#8b5cf6" font-family="ui-monospace, monospace" font-size="22" font-weight="600">CI</text>
  <text x="400" y="145" fill="#d0bfff" font-family="system-ui, sans-serif" font-size="18" font-weight="500">Enforcement</text>
  <text x="345" y="175" fill="#8b7bb8" font-family="system-ui, sans-serif" font-size="13">PR size guards</text>
  <text x="345" y="195" fill="#8b7bb8" font-family="system-ui, sans-serif" font-size="13">Test coverage gates</text>
  <text x="345" y="205" fill="#8b7bb8" font-family="system-ui, sans-serif" font-size="13">Pre-push hooks</text>

  <!-- Arrow 2-3 -->
  <line x1="535" y1="165" x2="575" y2="165" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="575,160 585,165 575,170" fill="#8b5cf6" opacity="0.5"/>

  <!-- Phase 3: Testing -->
  <rect x="590" y="110" width="200" height="110" rx="10" fill="url(#greenGlow)" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
  <text x="630" y="145" fill="#22c55e" font-family="ui-monospace, monospace" font-size="22" font-weight="600">***</text>
  <text x="670" y="145" fill="#b2f2bb" font-family="system-ui, sans-serif" font-size="18" font-weight="500">Testing</text>
  <text x="610" y="175" fill="#6b9b78" font-family="system-ui, sans-serif" font-size="13">Quality rules</text>
  <text x="610" y="195" fill="#6b9b78" font-family="system-ui, sans-serif" font-size="13">Visual regression</text>
  <text x="610" y="205" fill="#6b9b78" font-family="system-ui, sans-serif" font-size="13">Coverage enforcement</text>

  <!-- Arrow 3-4 -->
  <line x1="800" y1="165" x2="840" y2="165" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  <polygon points="840,160 850,165 840,170" fill="#22c55e" opacity="0.5"/>

  <!-- Phase 4: Workflow -->
  <rect x="855" y="110" width="200" height="110" rx="10" fill="url(#amberGlow)" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
  <text x="895" y="145" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="22" font-weight="600">/&gt;</text>
  <text x="930" y="145" fill="#ffd8a8" font-family="system-ui, sans-serif" font-size="18" font-weight="500">Workflow</text>
  <text x="875" y="175" fill="#b8935b" font-family="system-ui, sans-serif" font-size="13">/idea  /ship  /continue</text>
  <text x="875" y="195" fill="#b8935b" font-family="system-ui, sans-serif" font-size="13">Agent teams</text>
  <text x="875" y="205" fill="#b8935b" font-family="system-ui, sans-serif" font-size="13">Session state</text>

  <!-- Bottom divider -->
  <line x1="60" y1="250" x2="1040" y2="250" stroke="#333355" stroke-width="0.5" opacity="0.6"/>

  <!-- Tool badges -->
  <rect x="80" y="268" width="120" height="28" rx="14" fill="none" stroke="#4a9eed" stroke-width="1" opacity="0.6"/>
  <text x="140" y="287" text-anchor="middle" fill="#4a9eed" font-family="system-ui, sans-serif" font-size="13" opacity="0.8">Claude Code</text>

  <rect x="220" y="268" width="100" height="28" rx="14" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.6"/>
  <text x="270" y="287" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="13" opacity="0.8">Cursor</text>

  <rect x="340" y="268" width="100" height="28" rx="14" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
  <text x="390" y="287" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" opacity="0.8">Copilot</text>

  <text x="480" y="287" fill="#555577" font-family="system-ui, sans-serif" font-size="13">Works with any AI coding tool</text>

  <!-- Right side: metrics -->
  <text x="790" y="280" fill="#555577" font-family="system-ui, sans-serif" font-size="12">Battle-tested across</text>
  <text x="790" y="296" fill="#a0a0a0" font-family="ui-monospace, monospace" font-size="13" font-weight="600">3 repos  &#x2022;  40+ PRs  &#x2022;  4 phases</text>
</svg>
