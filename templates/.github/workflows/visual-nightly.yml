name: Visual Regression (Nightly)

on:
  schedule:
    - cron: "0 6 * * *"  # 6:00 AM UTC daily
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Update baseline screenshots"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  visual-regression:
    name: Visual Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "{DEV_BRANCH}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "{NODE_VERSION}"
          cache: "{PACKAGE_MANAGER}"

      - name: Install dependencies
        run: {PACKAGE_MANAGER} install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: {PACKAGE_MANAGER} run build

      - name: Run visual regression tests
        id: visual-tests
        run: |
          if [ "${{ github.event.inputs.update_baselines }}" = "true" ]; then
            npx playwright test --project=visual --update-snapshots
          else
            npx playwright test --project=visual
          fi
        continue-on-error: true

      - name: Upload test results
        if: steps.visual-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Upload updated baselines
        if: github.event.inputs.update_baselines == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-baselines
          path: tests/visual/**/*.png
          retention-days: 30

      - name: Commit updated baselines
        if: github.event.inputs.update_baselines == 'true' && steps.visual-tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/**/*.png
          git diff --cached --quiet && echo "No baseline changes" && exit 0
          git commit -m "test(visual): update baseline screenshots"
          git push

      - name: Create issue on failure
        if: steps.visual-tests.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Visual regression failures detected (${new Date().toISOString().slice(0, 10)})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'The nightly visual regression suite detected failures.',
                '',
                `**Workflow run**: ${runUrl}`,
                '',
                'Download the `visual-regression-results` artifact from the workflow run to review diffs.',
                '',
                'To update baselines, run the workflow manually with "Update baseline screenshots" enabled.',
              ].join('\n'),
              labels: ['visual-regression', 'automated'],
            });

      - name: Fail workflow on test failure
        if: steps.visual-tests.outcome == 'failure'
        run: |
          echo "::error::Visual regression tests failed. Check the uploaded artifacts for diff images."
          exit 1
